<section class="contact-section">
  <div class="contact-header">
    <h2>Contact Us</h2>
    <p>Get in touch with our admissions team or visit our campus in Batam.</p>
  </div>
  
  <div class="contact-container">
    <!-- Contact Info & Form -->
    <div class="contact-info">
      <h3>Visit Our Campus</h3>
      <p><strong>Address:</strong> 42RR+JW8, Sungai Panas, Kec. Batam Kota, Kota Batam, Kepulauan Riau 29444</p>
      <p><strong>Phone:</strong> (0778) 473399</p>
      <p><strong>Hours:</strong> Monday - Friday: 8:00 AM - 10:00 PM</p>
      
      <form class="contact-form">
        <input type="text" placeholder="Your Name" required>
        <input type="email" placeholder="Your Email Address" required>
        <textarea placeholder="How can we help you?" rows="5" required></textarea>
        <button type="button" class="submit-btn">Send Message</button>
      </form>
    </div>

    <!-- Free Google Maps Iframe Embed -->
    <!-- Free Google Maps Iframe Embed with precise pin drop -->
    <div class="map-container">
      <iframe 
        src="https://maps.google.com/maps?q=Universitas+Universal,+Batam&hl=en&z=17&output=embed" 
        width="100%" 
        height="100%" 
        style="border:0;" 
        allowfullscreen="" 
        loading="lazy" 
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>
  </div>
</section>
